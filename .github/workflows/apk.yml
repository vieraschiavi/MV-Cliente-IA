name: APK de Android

# El APK es pesado de construir (SDK + Gradle), así que no corre en cada push:
# sólo cuando cambia algo que termina adentro del APK, o a pedido.
#
# El resultado se publica en la Release del repo: la landing enlaza al canal
# estable /releases/latest/download/MVClienteIA.apk. El artifact de Actions
# expira y pide sesión de GitHub — no sirve como descarga de clientes.
on:
  workflow_dispatch:
  push:
    branches: ["claude/replicate-explee-kobra-s9sx0s"]
    paths:
      - 'webapp/frontend/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mismo portón que el instalador de Windows: el SDK de Android y Gradle son
  # diez minutos largos, y no se empiezan si el frontend no compila.
  verificar:
    name: Build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: webapp/frontend
      - run: npm run build
        working-directory: webapp/frontend

  apk:
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: |
          npm install
          cd webapp/frontend && npm ci

      - name: Compilar la web y sincronizar Capacitor
        run: npm run sync:android

      - name: Preparar el keystore de firma
        # El APK que se publicaba era el de DEBUG: `debuggable=true` y firmado
        # con la clave de debug de Gradle. Cualquiera con el teléfono y adb
        # hacía `run-as` y se llevaba el localStorage del WebView, donde viven
        # la clave del modelo, la del correo y las de X y LinkedIn. Ahora se
        # publica un release firmado de verdad.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64 (y sus contraseñas)."
            echo "Generá el keystore una vez y guardalo como secret:"
            echo "  keytool -genkeypair -v -keystore mvclienteia.jks -keyalg RSA \\"
            echo "          -keysize 4096 -validity 10000 -alias mvclienteia"
            echo "  base64 -w0 mvclienteia.jks   # -> secret ANDROID_KEYSTORE_BASE64"
            echo "Y agregá ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD."
            echo "GUARDÁ EL .jks: si se pierde, no se puede volver a publicar una"
            echo "actualización sobre las instalaciones existentes."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mvclienteia.jks"

      - name: Construir el APK de release firmado
        env:
          MVCLIENTE_KEYSTORE: ${{ runner.temp }}/mvclienteia.jks
          MVCLIENTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MVCLIENTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MVCLIENTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Comprobar que el APK no sea depurable
        # El motivo entero de este cambio. Si `debuggable` volviera a colarse,
        # esto corta antes de publicarlo, no después.
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          if "$AAPT" dump badging "$APK" 2>/dev/null | grep -q "application-debuggable"; then
            echo "::error::El APK quedó marcado como depurable"; exit 1
          fi
          echo "OK: el APK de release no es depurable"

      - name: Nombrar el APK y calcular SHA-256
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MVClienteIA.apk
          sha256sum MVClienteIA.apk > MVClienteIA.apk.sha256
          cat MVClienteIA.apk.sha256

      - name: Leer versión del paquete
        id: ver
        run: echo "MVVER=$(python3 -c 'import cliente_ia,sys;sys.stdout.write(cliente_ia.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Dejar el SHA-256 en INSTALADOR/CLIENTE/ (constancia versionada)
        # Mismo criterio que los instaladores de Windows: el binario no se
        # versiona (pesa), pero su hash sí — 89 bytes que dejan comprobar que
        # el APK que llegó a un teléfono es EXACTAMENTE el que compiló el CI.
        # `COMO-INSTALAR.md` manda a comparar contra esto.
        continue-on-error: true
        env:
          MVVER: ${{ steps.ver.outputs.MVVER }}
          RAMA: ${{ github.ref_name }}
        run: |
          mkdir -p INSTALADOR/CLIENTE
          cp MVClienteIA.apk.sha256 INSTALADOR/CLIENTE/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALADOR/CLIENTE/MVClienteIA.apk.sha256
          if git diff --cached --quiet; then
            echo "El hash del APK no cambió"
          else
            git commit -m "CI: SHA-256 del APK $MVVER"
            git pull --rebase --autostash origin "$RAMA"
            git push origin "HEAD:$RAMA"
          fi

      - name: Publicar en la Release (canal de descarga de la landing)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.MVVER }}
          name: MV Cliente IA v${{ steps.ver.outputs.MVVER }}
          files: |
            MVClienteIA.apk
            MVClienteIA.apk.sha256
