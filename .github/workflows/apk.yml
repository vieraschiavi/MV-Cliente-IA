name: APK de Android

# El APK es pesado de construir (SDK + Gradle), así que no corre en cada push:
# sólo cuando cambia algo que termina adentro del APK, o a pedido.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'webapp/frontend/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: |
          npm install
          cd webapp/frontend && npm ci

      - name: Compilar la web y sincronizar Capacitor
        run: npm run sync:android

      - name: Construir el APK de debug
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: MVClienteIA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
