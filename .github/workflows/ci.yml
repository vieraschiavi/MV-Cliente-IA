name: CI

# Corre en CUALQUIER rama y en todo PR. Antes decía `branches: [main]`, y
# cuando `main` se borró (la rama de trabajo pasó a ser la de por defecto) el
# CI dejó de correr sin avisar: quince commits seguidos sin tests ni linter en
# el servidor. Un filtro de rama que nombra una rama que puede desaparecer es
# un interruptor de apagado silencioso — por eso acá no hay ninguno.
on:
  push:
    paths-ignore: ['**.md', 'landing/**', 'public/**']
  pull_request:
    paths-ignore: ['**.md', 'landing/**', 'public/**']
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  motor:
    name: Motor y API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Antes de los tests: un import roto o una variable indefinida los
      # detecta ruff en segundos, sin esperar a la suite.
      - name: Linter
        run: ruff check .

      - name: Tests
        run: python -m pytest -q tests/

      # Prueba de humo del producto real: la corrida sobre el caso de Kobra
      # tiene que terminar con las tres olas y los tres idiomas.
      - name: Corrida end-to-end
        run: |
          python -m cliente_ia.pipeline mvkobranzaia.com --modo demo \
            --prospectos 60 --nombre "MV Kobra AI"

  web:
    name: Build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci
        working-directory: webapp/frontend
      - run: npm run build
        working-directory: webapp/frontend
      # Acá NO se sube el `dist` como artifact. Lo hacía, y la primera corrida
      # del CI arreglado murió con «Artifact storage quota has been hit»: el
      # build compilaba bien y el job igual salía rojo. Además el artifact no
      # le servía a nadie — los instaladores se construyen su propio frontend
      # y las descargas de los clientes salen de la Release, que es otra cuota.
      # Lo que este job tiene que responder es una sola pregunta: ¿compila?

  escritorio:
    name: App de escritorio (Electron)
    runs-on: ubuntu-latest
    # Que el frontend compile no prueba que la VENTANA abra. El instalador de
    # Windows se verifica en build_windows.yml, pero eso tarda y sólo corre en
    # releases: cuando se subió Electron de la 33 (fuera de soporte) a la 43 no
    # había forma barata de contestar «¿sigue andando la ventana?». Esto la
    # contesta en cada push, en Linux headless, en menos de un minuto.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          # Electron 43 declara `engines: node >= 22.12`.
          node-version: "22"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compilar el frontend que sirve el motor
        run: |
          cd webapp/frontend && npm ci && npm run build
      - name: Instalar Electron (árbol exacto del lock)
        run: cd electron && npm ci
      # Sin servidor X no hay ventana: xvfb le da una virtual. `--no-sandbox`
      # porque el runner corre como root y el sandbox de Chromium se niega.
      - name: Humo de la ventana
        run: |
          xvfb-run -a ./electron/node_modules/.bin/electron --no-sandbox \
            packaging/humo_electron.js
