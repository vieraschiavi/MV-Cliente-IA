name: Instalador de Windows

# Construye la app de escritorio (MVClienteIA_Setup.exe): el motor FastAPI
# empaquetado con PyInstaller + la UI React, envueltos por electron-builder en
# un instalador NSIS con desinstalador (aparece en "Agregar o quitar
# programas", no pide administrador). Mismo esquema que MV Kobra AI.
#
# El .exe se publica en la Release del repo: la landing enlaza al canal
# estable /releases/latest/download/MVClienteIA_Setup.exe. Los artifacts de
# Actions expiran y piden sesión de GitHub — no sirven como descarga de
# clientes.
#
# Los minutos de Windows facturan al doble: no corre en cada push, sólo
# cuando cambia algo que termina adentro del instalador, o a pedido.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/replicate-explee-kobra-s9sx0s"]
    paths:
      - ".github/workflows/build_windows.yml"
      - "packaging/**"
      - "electron/**"
      - "cliente_ia/**"
      - "webapp/**"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portón barato antes del caro. Los minutos de Windows facturan al doble;
  # gastarlos en un commit que no pasa el linter es tirar plata y tiempo por
  # algo que ubuntu detecta en dos minutos.
  verificar:
    name: Linter y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q tests/

  build:
    needs: verificar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # el paso que commitea los SHA-256 hace rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Setup Node (para compilar la app React del instalador)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar la app React (webapp/frontend/dist)
        # Node sólo hace falta acá, en CI; nunca en la PC del cliente final.
        run: |
          cd webapp/frontend
          npm ci
          npm run build

      - name: Construir el motor (PyInstaller)
        run: pyinstaller packaging/mvclienteia.spec --noconfirm --clean

      - name: Verificar salida de PyInstaller
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/MVClienteIA/MVClienteIA.exe")) {
            Write-Error "No se generó dist/MVClienteIA/MVClienteIA.exe"; exit 1
          }
          Write-Host "Bundle OK"

      - name: Probar que el motor empaquetado ARRANQUE y sirva el producto
        # Que el .exe exista no quiere decir que corra. El error clásico de
        # PyInstaller es un import que resuelve por nombre en runtime y que el
        # análisis estático no vio: el bundle se arma perfecto y revienta al
        # abrirlo en la máquina del comprador. Acá se levanta de verdad y se
        # le corren las seis fases por HTTP.
        shell: pwsh
        run: |
          $env:MVCLIENTE_DIR_DATOS = "$env:RUNNER_TEMP\datos-motor"
          # Sin redirigir la salida a propósito: así es como lo abre alguien
          # que hace doble click, y es justo el caso en el que PyInstaller deja
          # sys.stdout en None. Si se redirigiera, el bug quedaría tapado.
          $p = Start-Process "dist\MVClienteIA\MVClienteIA.exe" `
                 -ArgumentList "--puerto","8812" -PassThru -WindowStyle Hidden
          try {
            python packaging/humo.py --url http://127.0.0.1:8812 --edicion demo --prospectos 50
            $ok = $LASTEXITCODE
          } finally {
            if ($p.HasExited) {
              Write-Host "El motor se murió solo. Código de salida: $($p.ExitCode)"
            } else {
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            }
          }
          if ($ok -ne 0) { Write-Error "El motor empaquetado no pasó la prueba de humo"; exit 1 }

      - name: Leer versión del paquete
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import cliente_ia,sys;sys.stdout.write(cliente_ia.__version__)"
          "MVVER=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Construir las ediciones (NSIS + ZIP portable)
        # El MISMO programa; lo único que cambia es el sello `edicion.json`
        # que se hornea al lado del ejecutable:
        #
        #   demo    → 14 días de prueba, la que se ofrece en la landing
        #   cliente → pide la clave de licencia; es la que recibe quien paga
        #
        # Se construye dos veces en vez de parchear un binario después: un
        # .exe tocado a posteriori rompe la firma y lo marca cualquier
        # antivirus.
        shell: pwsh
        run: |
          cd electron
          npm pkg set version=${{ steps.ver.outputs.MVVER }}
          npm install
          # Las DOS, siempre. Antes en un push normal se armaba sólo `cliente`
          # para ahorrar minutos de Windows, pero la landing enlaza a
          # `MVClienteIA_Setup_demo.exe` por /releases/latest/download: si un
          # push publica una Release sin la demo, el botón de descarga de la
          # web tira 404 hasta que alguien se acuerde de lanzar el build a
          # mano. El repositorio es público y los minutos ya no se facturan,
          # así que no queda ni la excusa del costo.
          #
          # La edición `owner` NO está en la lista a propósito: lleva el
          # permiso adentro del .exe y este repositorio es PÚBLICO, así que
          # publicarla sería regalar la versión completa. El dueño usa la
          # edición `cliente` con una clave a su nombre — mismo resultado, y
          # revocable. Si el repo vuelve a ser privado, agregar "owner" acá y
          # el paso de publicación de más abajo se vuelve a habilitar solo.
          $ediciones = @("demo", "cliente")
          Write-Host "Ediciones a construir: $($ediciones -join ', ')"
          foreach ($ed in $ediciones) {
            Write-Host "=== Edición $ed ==="
            # El sello va DENTRO del backend empaquetado, al lado del .exe de
            # PyInstaller, que es donde `licencia._ruta_sello()` lo busca.
            "{""edicion"": ""$ed""}" | Out-File -Encoding utf8 -NoNewline `
              "../dist/MVClienteIA/edicion.json"
            npx electron-builder --win --publish never
            if (-Not (Test-Path "dist_installer/MVClienteIA_Setup.exe")) {
              Write-Error "No se generó el instalador de la edición $ed"; exit 1
            }
            if (-Not (Test-Path "dist_installer/MVClienteIA_Portable.zip")) {
              Write-Error "No se generó el ZIP portable de la edición $ed"; exit 1
            }
            $sufijo = if ($ed -eq "cliente") { "" } else { "_$ed" }
            Copy-Item "dist_installer/MVClienteIA_Setup.exe" `
                      "../dist/MVClienteIA_Setup$sufijo.exe"
            Copy-Item "dist_installer/MVClienteIA_Portable.zip" `
                      "../dist/MVClienteIA_Portable$sufijo.zip"
            Remove-Item "dist_installer/*" -Recurse -Force
          }
        env:
          # Sin firma de código por ahora: no fallar buscando certificado. La
          # landing avisa del cartel de SmartScreen y publica el SHA-256.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}

      - name: Armar la edición BAT (la que abre sin ningún .exe)
        # Mismo código y mismo build de React que el instalador: el ZIP se
        # arma del mismo árbol, no de una copia paralela. Las ruedas de
        # vendor/ son las que permiten instalarlo en una máquina sin salida
        # a PyPI, que es la mitad del motivo por el que esta edición existe.
        shell: pwsh
        run: |
          foreach ($ed in @("demo", "cliente")) {
            python packaging/armar_bat.py --edicion $ed --vendor 3.11,3.12,3.13
            if ($LASTEXITCODE -ne 0) { Write-Error "Falló el armado BAT de $ed"; exit 1 }
          }

      - name: Probar la edición BAT como la usa un cliente
        # El .bat se corre DE VERDAD, con un Python recién creado y vacío para
        # que tenga que instalar las dependencias desde vendor/ igual que en
        # la máquina del comprador. Si se usara el Python del runner —que ya
        # tiene fastapi— el camino sin internet no se probaría nunca y se
        # publicaría un ZIP que falla en el primer cliente sin PyPI.
        shell: pwsh
        run: |
          $raiz = "$env:RUNNER_TEMP\bat"
          Expand-Archive dist\MVClienteIA_BAT_demo.zip -DestinationPath $raiz -Force
          $prog = Join-Path $raiz "MVClienteIA"

          python -m venv "$env:RUNNER_TEMP\limpio"
          $limpio = "$env:RUNNER_TEMP\limpio\Scripts\python.exe"
          & $limpio -c "import fastapi" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error "El Python de prueba no está limpio"; exit 1 }

          # Un .cmd envoltorio en vez de pelear con el escapado de comillas
          # entre PowerShell y cmd.exe, que es donde se rompen estas cosas.
          @"
          @echo off
          set "MVCLIENTE_PYTHON=$limpio"
          set "MVCLIENTE_SIN_PAUSA=1"
          set "MVCLIENTE_HOME=$env:RUNNER_TEMP\datos-bat"
          cd /d "$prog"
          call MVClienteIA.bat --puerto 8811 --no-abrir
          "@ | Set-Content -Encoding ASCII "$env:RUNNER_TEMP\correr.cmd"

          $p = Start-Process cmd -ArgumentList "/c","$env:RUNNER_TEMP\correr.cmd" `
                 -PassThru -WindowStyle Hidden `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\bat.log" `
                 -RedirectStandardError  "$env:RUNNER_TEMP\bat.err"
          try {
            python packaging/humo.py --url http://127.0.0.1:8811 --edicion demo --prospectos 50
            $ok = $LASTEXITCODE
          } finally {
            Write-Host "--- salida del .bat ---"
            if (Test-Path "$env:RUNNER_TEMP\bat.log") { Get-Content "$env:RUNNER_TEMP\bat.log" }
            if (Test-Path "$env:RUNNER_TEMP\bat.err") { Get-Content "$env:RUNNER_TEMP\bat.err" }
            Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
              Where-Object { $_.CommandLine -like "*lanzador_escritorio*" } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            if (-Not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($ok -ne 0) { Write-Error "La edición BAT no pasó la prueba de humo"; exit 1 }

          # Que haya usado vendor/ y no internet es el punto de todo esto.
          $log = Get-Content "$env:RUNNER_TEMP\bat.log" -Raw
          if ($log -notmatch "instalando desde vendor") {
            Write-Error "El .bat no instaló desde vendor\: el modo sin internet no quedó probado"
            exit 1
          }
          Write-Host "OK: instaló sin internet desde vendor\ y sirvió el producto entero"

      - name: Probar Instalar.bat y Desinstalar.bat de verdad
        # Accesos directos, Menú Inicio y "Agregar o quitar programas": se
        # crean, se comprueban y se sacan. Es lo que el usuario pidió que
        # funcione, y no hay forma de saberlo sin hacerlo en una Windows.
        shell: pwsh
        run: |
          $prog = "$env:RUNNER_TEMP\bat\MVClienteIA"
          $env:MVCLIENTE_SIN_PAUSA = "1"
          $clave = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MVClienteIA"

          & cmd /c "`"$prog\Instalar.bat`""
          if ($LASTEXITCODE -ne 0) { Write-Error "Instalar.bat devolvió $LASTEXITCODE"; exit 1 }

          $esc  = Join-Path ([Environment]::GetFolderPath('Desktop')) 'MV Cliente IA.lnk'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'MV Cliente IA'
          foreach ($ruta in @($esc, (Join-Path $menu 'MV Cliente IA.lnk'),
                              (Join-Path $menu 'Desinstalar MV Cliente IA.lnk'))) {
            if (-Not (Test-Path $ruta)) { Write-Error "No se creó $ruta"; exit 1 }
          }
          if (-Not (Test-Path $clave)) { Write-Error "No quedó en Agregar o quitar programas"; exit 1 }
          $reg = Get-ItemProperty $clave
          if ($reg.DisplayName -ne "MV Cliente IA") { Write-Error "DisplayName mal: $($reg.DisplayName)"; exit 1 }
          if (-Not $reg.UninstallString) { Write-Error "Sin UninstallString: no se puede desinstalar"; exit 1 }
          # El acceso directo tiene que apuntar a algo que exista.
          $ws = New-Object -ComObject WScript.Shell
          $destino = $ws.CreateShortcut($esc).TargetPath
          if (-Not (Test-Path $destino)) { Write-Error "El acceso directo apunta a $destino, que no existe"; exit 1 }
          Write-Host "OK: escritorio + menú inicio + agregar/quitar programas, y el acceso directo abre $destino"

          & cmd /c "`"$prog\Desinstalar.bat`""
          if ($LASTEXITCODE -ne 0) { Write-Error "Desinstalar.bat devolvió $LASTEXITCODE"; exit 1 }
          foreach ($ruta in @($esc, $menu, $clave)) {
            if (Test-Path $ruta) { Write-Error "Quedó sin borrar: $ruta"; exit 1 }
          }
          Write-Host "OK: desinstaló y no dejó nada colgado"

      - name: Probar el instalador NSIS en silencio
        # Instala, comprueba que deje lo que promete y desinstala. Si el
        # desinstalador no anda, se descubre acá y no en la máquina de un
        # cliente que ya no puede sacarlo.
        shell: pwsh
        run: |
          $destino = "$env:RUNNER_TEMP\nsis"
          Start-Process "dist\MVClienteIA_Setup_demo.exe" `
            -ArgumentList "/S","/D=$destino" -Wait
          if (-Not (Test-Path "$destino\MV Cliente IA.exe")) {
            Write-Error "El instalador no dejó el ejecutable en $destino"; exit 1
          }
          # `runAfterFinish` deja la app abierta después de instalar. Si queda
          # viva, su motor ocupa un puerto y el desinstalador no puede borrar
          # los archivos que tiene tomados.
          Start-Sleep -Seconds 5
          Get-Process -Name "MV Cliente IA","MVClienteIA" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $desinst = Get-ChildItem $destino -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-Not $desinst) { Write-Error "El instalador no dejó desinstalador"; exit 1 }
          Write-Host "OK: instalado en $destino con $($desinst.Name)"

          # El motor que quedó instalado tiene que servir el producto.
          $env:MVCLIENTE_DIR_DATOS = "$env:RUNNER_TEMP\datos-nsis"
          $p = Start-Process "$destino\resources\backend\MVClienteIA.exe" `
                 -ArgumentList "--puerto","8813" -PassThru -WindowStyle Hidden
          try {
            python packaging/humo.py --url http://127.0.0.1:8813 --edicion demo --prospectos 50
            $ok = $LASTEXITCODE
          } finally {
            if (-Not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
          if ($ok -ne 0) { Write-Error "El programa instalado no pasó la prueba de humo"; exit 1 }

          Start-Process $desinst.FullName -ArgumentList "/S" -Wait
          # El desinstalador de NSIS se copia al temporal y sigue borrando
          # después de que el proceso original terminó: mirar enseguida da un
          # falso negativo.
          $borrado = $false
          foreach ($i in 1..12) {
            Start-Sleep -Seconds 5
            if (-Not (Test-Path "$destino\MV Cliente IA.exe")) { $borrado = $true; break }
          }
          if (-Not $borrado) {
            Write-Error "El desinstalador dejó el ejecutable en su lugar tras 60s"
            Get-ChildItem $destino -ErrorAction SilentlyContinue | Select-Object -First 20 Name
            exit 1
          }
          Write-Host "OK: instaló, corrió el producto entero y desinstaló limpio"

      - name: Calcular SHA-256 (verificación de integridad de las descargas)
        shell: pwsh
        run: |
          # Se hashea lo que EXISTE, no una lista fija: pedirle el hash a un
          # archivo que no está corta el build por nada.
          Get-ChildItem "dist/MVClienteIA_*.exe", "dist/MVClienteIA_*.zip" |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
              Write-Host "SHA-256 $($_.Name): $h"
            }

      - name: Dejar los SHA-256 en INSTALADOR/ (constancia versionada)
        # Nunca puede bloquear la publicación del instalador: los hashes son
        # un extra, la Release es lo que baja el comprador.
        continue-on-error: true
        # Los binarios NO se versionan (95 MB + 126 MB quedarían en el
        # historial para siempre, y el ZIP supera el límite de 100 MB por
        # archivo), pero sus hashes sí: son 89 bytes y permiten comprobar que
        # el archivo que bajó un comprador es EXACTAMENTE el que compiló CI.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path INSTALADOR | Out-Null
          Copy-Item dist/*.sha256 INSTALADOR/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALADOR/*.sha256
          if (git diff --cached --quiet) {
            Write-Host "Los hashes no cambiaron"
          } else {
            git commit -m "CI: SHA-256 del build ${{ steps.ver.outputs.MVVER }}"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          }

      - name: Publicar en la Release (canal de descarga de los clientes)
        # Acá va SÓLO lo que baja un comprador: la demo y la edición cliente.
        # La edición owner NO se publica en la Release — se sube aparte, y su
        # candado es que el repositorio sea privado.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.MVVER }}
          name: MV Cliente IA v${{ steps.ver.outputs.MVVER }}
          fail_on_unmatched_files: false
          body: >
            App de escritorio para Windows en dos formas, para que siempre
            haya una que se pueda abrir.


            **Con instalador (.exe)** — Electron + React, no necesita Python
            ni instalar nada más. `MVClienteIA_Setup_demo.exe` son 14 días con
            todo abierto y sin clave; `MVClienteIA_Setup.exe` es la comprada y
            pide una vez la clave de licencia. Las dos instalan igual:
            asistente en es/pt/en, elección de carpeta, acceso directo en el
            Escritorio y en el Menú Inicio, y desinstalador en "Agregar o
            quitar programas", sin permisos de administrador. Cada una trae
            además su `_Portable.zip`, que se descomprime en el disco que
            quieras (D:\, un pendrive) y se ejecuta sin instalador.


            **Sin ningún .exe (BAT)** — `MVClienteIA_BAT_demo.zip` y
            `MVClienteIA_BAT_cliente.zip`, para las empresas donde no se
            pueden abrir programas descargados. Es el MISMO producto con la
            misma interfaz: se descomprime, se hace doble click en
            `MVClienteIA.bat` y se abre en el navegador. Usa el Python que ya
            está en la máquina (3.11 o más nuevo) y trae las dependencias
            adentro, así que instala sin internet. `Instalar.bat` deja el
            acceso directo, el Menú Inicio y el desinstalador igual que el
            `.exe`.


            Cada `.sha256` permite verificar la integridad de la descarga.
            Todo lo publicado acá se instaló, se corrió y se desinstaló en una
            máquina Windows antes de subirse.
          files: |
            dist/MVClienteIA_Setup.exe
            dist/MVClienteIA_Setup.exe.sha256
            dist/MVClienteIA_Portable.zip
            dist/MVClienteIA_Portable.zip.sha256
            dist/MVClienteIA_Setup_demo.exe
            dist/MVClienteIA_Setup_demo.exe.sha256
            dist/MVClienteIA_Portable_demo.zip
            dist/MVClienteIA_Portable_demo.zip.sha256
            dist/MVClienteIA_BAT_demo.zip
            dist/MVClienteIA_BAT_demo.zip.sha256
            dist/MVClienteIA_BAT_cliente.zip
            dist/MVClienteIA_BAT_cliente.zip.sha256

      - name: Comprobar que el repositorio siga siendo privado
        # Red de seguridad de la edición owner. Hoy no se construye (el repo es
        # público), así que este paso se saltea por el hashFiles. Queda para el
        # día que alguien la vuelva a habilitar: si el repo no es privado,
        # corta acá en vez de que se descubra cuando ya se la bajaron.
        id: visibilidad
        if: hashFiles('dist/MVClienteIA_Setup_owner.exe') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vis = gh repo view ${{ github.repository }} --json visibility --jq .visibility
          Write-Host "Visibilidad del repositorio: $vis"
          if ($vis -ne "private") {
            Write-Error @"
          El repositorio es '$vis', no 'private'.
          La edición owner lleva el permiso adentro del archivo y su unica
          proteccion es que este repo sea privado. NO se publica.
          Si esto es a proposito: borra la Release owner-v* y saca este paso.
          "@
            exit 1
          }

      - name: Publicar la edición owner (sólo para el dueño)
        if: steps.visibilidad.outcome == 'success' &&
            hashFiles('dist/MVClienteIA_Setup_owner.exe') != ''
        # En una Release APARTE, marcada como prerelease para que no aparezca
        # como "latest" ni la agarre ningún enlace de la landing. Lo único que
        # la protege es que el repositorio sea privado: si el repo se hace
        # público, ESTA release hay que borrarla primero.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v${{ steps.ver.outputs.MVVER }}
          name: "[OWNER] MV Cliente IA v${{ steps.ver.outputs.MVVER }}"
          prerelease: true
          body: >
            Edición **owner**: idéntica a la versión completa, sin clave de
            licencia y sin vencimiento. No la baja ningún cliente — este
            repositorio es privado y la Release está marcada como prerelease
            para que no la tome el canal `latest`. Si alguna vez el repo se
            hace público, borrar esta Release ANTES.
          files: |
            dist/MVClienteIA_Setup_owner.exe
            dist/MVClienteIA_Setup_owner.exe.sha256
            dist/MVClienteIA_Portable_owner.zip
            dist/MVClienteIA_Portable_owner.zip.sha256
