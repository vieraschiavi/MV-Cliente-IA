name: Instalador de Windows

# Construye la app de escritorio (MVClienteIA_Setup.exe): el motor FastAPI
# empaquetado con PyInstaller + la UI React, envueltos por electron-builder en
# un instalador NSIS con desinstalador (aparece en "Agregar o quitar
# programas", no pide administrador). Mismo esquema que MV Kobra AI.
#
# El .exe se publica en la Release del repo: la landing enlaza al canal
# estable /releases/latest/download/MVClienteIA_Setup.exe. Los artifacts de
# Actions expiran y piden sesión de GitHub — no sirven como descarga de
# clientes.
#
# Los minutos de Windows facturan al doble: no corre en cada push, sólo
# cuando cambia algo que termina adentro del instalador, o a pedido.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/replicate-explee-kobra-s9sx0s"]
    paths:
      - ".github/workflows/build_windows.yml"
      - "packaging/**"
      - "electron/**"
      - "cliente_ia/**"
      - "webapp/**"

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portón barato antes del caro. Los minutos de Windows facturan al doble;
  # gastarlos en un commit que no pasa el linter es tirar plata y tiempo por
  # algo que ubuntu detecta en dos minutos.
  verificar:
    name: Linter y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q tests/

  build:
    needs: verificar
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # el paso que commitea los SHA-256 hace rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Setup Node (para compilar la app React del instalador)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar la app React (webapp/frontend/dist)
        # Node sólo hace falta acá, en CI; nunca en la PC del cliente final.
        run: |
          cd webapp/frontend
          npm ci
          npm run build

      - name: Construir el motor (PyInstaller)
        run: pyinstaller packaging/mvclienteia.spec --noconfirm --clean

      - name: Verificar salida de PyInstaller
        shell: pwsh
        run: |
          if (-Not (Test-Path "dist/MVClienteIA/MVClienteIA.exe")) {
            Write-Error "No se generó dist/MVClienteIA/MVClienteIA.exe"; exit 1
          }
          Write-Host "Bundle OK"

      - name: Leer versión del paquete
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import cliente_ia,sys;sys.stdout.write(cliente_ia.__version__)"
          "MVVER=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Construir las tres ediciones (NSIS + ZIP portable)
        # El MISMO programa tres veces; lo único que cambia es el sello
        # `edicion.json` que se hornea al lado del ejecutable:
        #
        #   demo    → 14 días de prueba, la que se ofrece en la landing
        #   cliente → pide la clave de licencia; es la que recibe quien paga
        #   owner   → sin clave ni vencimiento; sólo se publica en el repo
        #             privado, nunca en la Release pública
        #
        # Construir tres veces en vez de parchear un binario después: un .exe
        # tocado a posteriori rompe la firma y lo marca cualquier antivirus.
        shell: pwsh
        run: |
          cd electron
          npm pkg set version=${{ steps.ver.outputs.MVVER }}
          npm install
          foreach ($ed in "demo", "cliente", "owner") {
            Write-Host "=== Edición $ed ==="
            # El sello va DENTRO del backend empaquetado, al lado del .exe de
            # PyInstaller, que es donde `licencia._ruta_sello()` lo busca.
            "{""edicion"": ""$ed""}" | Out-File -Encoding utf8 -NoNewline `
              "../dist/MVClienteIA/edicion.json"
            npx electron-builder --win --publish never
            if (-Not (Test-Path "dist_installer/MVClienteIA_Setup.exe")) {
              Write-Error "No se generó el instalador de la edición $ed"; exit 1
            }
            if (-Not (Test-Path "dist_installer/MVClienteIA_Portable.zip")) {
              Write-Error "No se generó el ZIP portable de la edición $ed"; exit 1
            }
            $sufijo = if ($ed -eq "cliente") { "" } else { "_$ed" }
            Copy-Item "dist_installer/MVClienteIA_Setup.exe" `
                      "../dist/MVClienteIA_Setup$sufijo.exe"
            Copy-Item "dist_installer/MVClienteIA_Portable.zip" `
                      "../dist/MVClienteIA_Portable$sufijo.zip"
            Remove-Item "dist_installer/*" -Recurse -Force
          }
        env:
          # Sin firma de código por ahora: no fallar buscando certificado. La
          # landing avisa del cartel de SmartScreen y publica el SHA-256.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Calcular SHA-256 (verificación de integridad de las descargas)
        shell: pwsh
        run: |
          $archivos = @(
            "MVClienteIA_Setup.exe",        "MVClienteIA_Portable.zip",
            "MVClienteIA_Setup_demo.exe",   "MVClienteIA_Portable_demo.zip",
            "MVClienteIA_Setup_owner.exe",  "MVClienteIA_Portable_owner.zip")
          foreach ($f in $archivos) {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Out-File -Encoding ascii "dist/$f.sha256"
            Write-Host "SHA-256 ${f}: $h"
          }

      - name: Dejar los SHA-256 en INSTALADOR/ (constancia versionada)
        # Nunca puede bloquear la publicación del instalador: los hashes son
        # un extra, la Release es lo que baja el comprador.
        continue-on-error: true
        # Los binarios NO se versionan (95 MB + 126 MB quedarían en el
        # historial para siempre, y el ZIP supera el límite de 100 MB por
        # archivo), pero sus hashes sí: son 89 bytes y permiten comprobar que
        # el archivo que bajó un comprador es EXACTAMENTE el que compiló CI.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path INSTALADOR | Out-Null
          Copy-Item dist/*.sha256 INSTALADOR/ -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INSTALADOR/*.sha256
          if (git diff --cached --quiet) {
            Write-Host "Los hashes no cambiaron"
          } else {
            git commit -m "CI: SHA-256 del build ${{ steps.ver.outputs.MVVER }}"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          }

      - name: Publicar en la Release (canal de descarga de los clientes)
        # Acá va SÓLO lo que baja un comprador: la demo y la edición cliente.
        # La edición owner NO se publica en la Release — se sube aparte, y su
        # candado es que el repositorio sea privado.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.MVVER }}
          name: MV Cliente IA v${{ steps.ver.outputs.MVVER }}
          body: >
            App de escritorio para Windows (Electron + React, no requiere
            Python ni dependencias). **Probala**: `MVClienteIA_Setup_demo.exe`,
            14 días con todo abierto y sin clave. **Comprada**:
            `MVClienteIA_Setup.exe`, que pide una vez la clave de licencia que
            llega con la compra. Las dos instalan igual — asistente en
            es/pt/en, elección de carpeta, acceso directo en el Escritorio y en
            el Menú Inicio, y desinstalador en "Agregar o quitar programas",
            sin permisos de administrador. Cada una trae además su
            `_Portable.zip`: se descomprime en el disco que quieras (D:\, un
            pendrive) y se ejecuta `MVClienteIA.exe` — sin instalador ni
            archivos temporales en C:. Si el instalador falla escribiendo en
            Temp, suele ser el antivirus o falta de espacio en C:; usá la
            portable. Cada `.sha256` permite verificar la integridad de la
            descarga.
          files: |
            dist/MVClienteIA_Setup.exe
            dist/MVClienteIA_Setup.exe.sha256
            dist/MVClienteIA_Portable.zip
            dist/MVClienteIA_Portable.zip.sha256
            dist/MVClienteIA_Setup_demo.exe
            dist/MVClienteIA_Setup_demo.exe.sha256
            dist/MVClienteIA_Portable_demo.zip
            dist/MVClienteIA_Portable_demo.zip.sha256

      - name: Publicar la edición owner (sólo para el dueño)
        # En una Release APARTE, marcada como prerelease para que no aparezca
        # como "latest" ni la agarre ningún enlace de la landing. Lo único que
        # la protege es que el repositorio sea privado: si el repo se hace
        # público, ESTA release hay que borrarla primero.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v${{ steps.ver.outputs.MVVER }}
          name: "[OWNER] MV Cliente IA v${{ steps.ver.outputs.MVVER }}"
          prerelease: true
          body: >
            Edición **owner**: idéntica a la versión completa, sin clave de
            licencia y sin vencimiento. No la baja ningún cliente — este
            repositorio es privado y la Release está marcada como prerelease
            para que no la tome el canal `latest`. Si alguna vez el repo se
            hace público, borrar esta Release ANTES.
          files: |
            dist/MVClienteIA_Setup_owner.exe
            dist/MVClienteIA_Setup_owner.exe.sha256
            dist/MVClienteIA_Portable_owner.zip
            dist/MVClienteIA_Portable_owner.zip.sha256
            dist/MVClienteIA_Portable.zip.sha256
