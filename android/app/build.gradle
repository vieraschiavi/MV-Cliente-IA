apply plugin: 'com.android.application'

android {
    namespace "com.mvclienteia.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mvclienteia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Número de versión que crece en cada build del CI (minutos desde
        // 1970, ver apk.yml / apk_owner.yml). Estuvo fijo en 1 desde el
        // primer APK: Android no podía distinguir una versión de otra y Play
        // Store rechaza subir dos veces el mismo número. Por minutos y no por
        // `run_number` porque el APK cliente y el owner salen de workflows
        // distintos con contadores distintos, comparten applicationId y
        // firma, y el número de uno no puede quedar por debajo del otro (eso
        // es un "downgrade" que Android no instala). Sin la variable (build
        // local) queda en 1, como antes.
        // Con `=` y paréntesis: sin ellos Groovy lee `versionCode (x).toInteger()`
        // como `versionCode(x)` seguido de `.toInteger()` sobre su resultado
        // (null), y el build moría con «Value is null».
        versionCode = Integer.parseInt(System.getenv("MVCLIENTE_VERSION_CODE") ?: "1")
        versionName = (System.getenv("MVCLIENTE_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La firma sale de variables de entorno (secrets del CI), nunca de un
    // keystore versionado. Si no están, no se define la config y el build de
    // release falla en vez de caer a la clave de debug sin avisar.
    signingConfigs {
        release {
            if (System.getenv("MVCLIENTE_KEYSTORE")) {
                storeFile file(System.getenv("MVCLIENTE_KEYSTORE"))
                storePassword System.getenv("MVCLIENTE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MVCLIENTE_KEY_ALIAS")
                keyPassword System.getenv("MVCLIENTE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Explícito aunque sea el default: el APK que se publicaba era el
            // de DEBUG, y ahí `debuggable` es true. Con eso, cualquiera con el
            // teléfono en la mano y adb corría `run-as` y leía el localStorage
            // del WebView — la clave del modelo, la del correo y las de X y
            // LinkedIn. Que esté escrito evita que se vuelva a colar.
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("MVCLIENTE_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
